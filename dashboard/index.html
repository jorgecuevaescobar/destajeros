<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="robots" content="noindex">
<title>CIERRE CAC – Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f5f6f8;color:#1f2937}#boot{text-align:center;margin-top:30vh;color:#6b7280}</style>
</head>
<body>
<div id="boot">Cargando CIERRE CAC…</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
window.API = 'https://script.google.com/macros/s/AKfycbzQN1t9W_4Sfunc21NC27AISAFLcjXbUt7p5CTLBD_enKF60rgJVWtT1PUyIKMtsGTvCA/exec';
(async function () {
  const boot = document.getElementById('boot');
  try {
    const r = await fetch(window.API + '?f=app&v=' + Date.now(), {cache: 'no-store'});
    const b = await r.json();
    const st = document.createElement('style'); st.textContent = b.css; document.head.appendChild(st);
    document.body.insertAdjacentHTML('beforeend', b.html);
    boot.remove();
    const sc = document.createElement('script'); sc.textContent = b.js; document.body.appendChild(sc);
  } catch (e) {
    boot.textContent = 'No se pudo cargar. Revisa tu conexión y vuelve a abrir.';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
