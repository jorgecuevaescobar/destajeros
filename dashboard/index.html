<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CIERRE CAC">
<title>CIERRE CAC – Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f5f6f8;color:#1f2937}#boot{text-align:center;margin-top:28vh;color:#6b7280}#upd{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#2563eb;color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:15px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25)}@media (prefers-color-scheme:dark){body{background:#111418;color:#e5e7eb}}</style>
</head>
<body>
<div id="boot"><img src="icon-192.png" alt="CIERRE CAC" width="120" height="120" style="border-radius:24px;display:block;margin:0 auto 12px"><span>Cargando…</span></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
window.API = 'https://script.google.com/macros/s/AKfycbzQN1t9W_4Sfunc21NC27AISAFLcjXbUt7p5CTLBD_enKF60rgJVWtT1PUyIKMtsGTvCA/exec';
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installEvt = e; if (window.__redraw) window.__redraw(); });
window.__pre = {data: fetch(window.API + '?f=data&v=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.text(); }).catch(function () { return null; })};
(function () {
  var boot = document.getElementById('boot'), K = 'cierre_app_b', cached = null;
  try { cached = localStorage.getItem(K); } catch (e) {}
  function run(b) {
    var st = document.createElement('style'); st.textContent = b.css; document.head.appendChild(st);
    document.body.insertAdjacentHTML('beforeend', b.html);
    if (boot) boot.remove();
    var sc = document.createElement('script'); sc.textContent = b.js; document.body.appendChild(sc);
  }
  var net = fetch(window.API + '?f=app&v=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.text(); });
  if (cached) {
    try { run(JSON.parse(cached)); } catch (e) { cached = null; }
  }
  net.then(function (t) {
    if (!t || t.charAt(0) !== '{') return;
    var b; try { b = JSON.parse(t); } catch (e) { return; }
    if (!b.js) return;
    if (!cached) { try { localStorage.setItem(K, t); } catch (e) {} run(b); return; }
    if (t !== cached) {
      try { localStorage.setItem(K, t); } catch (e) {}
      var u = document.createElement('button'); u.id = 'upd'; u.textContent = '↻ Hay una versión nueva: toca para actualizar';
      u.onclick = function () { location.reload(); }; document.body.appendChild(u);
    }
  }).catch(function () { if (!cached && boot) boot.lastChild.textContent = 'No se pudo cargar. Revisa tu conexión y vuelve a abrir.'; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
